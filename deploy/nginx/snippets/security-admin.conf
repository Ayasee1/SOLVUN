# Security headers for the admin dashboard (admin.*).
#
# Kept in one snippet because add_header does not merge: any location that sets
# its own add_header (for example Cache-Control) must include this file again.
#
# The CSP allows exactly what the dashboard loads today: its own bundle and
# Google Fonts. frame-ancestors 'none' stops anyone from framing the sign-in
# form.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
