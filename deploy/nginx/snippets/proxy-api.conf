# Shared proxy settings for the Solvun API.
#
# Included from a location block, so proxy_pass stays in that location.

proxy_http_version 1.1;

# Keep the public host so the app can build absolute URLs and logs read well.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Required for keepalive connections to the upstream.
proxy_set_header Connection "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# The API only receives JSON bodies and form posts; nothing uploads files.
client_max_body_size 2m;
