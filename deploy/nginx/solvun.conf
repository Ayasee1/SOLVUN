# Solvun — nginx site configuration
#
# Place at /etc/nginx/sites-available/solvun.conf, symlink into
# sites-enabled, and keep the snippets directory next to it:
#
#   /etc/nginx/snippets/proxy-api.conf
#   /etc/nginx/snippets/security-shop.conf
#   /etc/nginx/snippets/security-admin.conf
#
# Replace shop.example.com / admin.example.com and the /var/www paths.
#
# Routing model
# -------------
#   shop.*   /api/*      -> API with the /api prefix stripped
#            /order/*    -> API (HTML order status page)
#            /orders/*   -> API (invoice PDF, public order JSON)
#            /track      -> API (HTML tracking page)
#            everything else -> the storefront SPA
#   admin.*  /api/*      -> API with the /api prefix stripped
#            everything else -> the admin SPA
#
# Both hosts proxy /api to the same upstream, so the browser sees one origin
# per host and the HttpOnly admin session cookie is sent on every API call.

upstream solvun_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---------------------------------------------------------------- http level

server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

# Brute-force guard in front of the app's own limiter. Only POSTs are counted;
# an empty key means "not accounted", so GET /api/admin/session (the dashboard
# health check) is never throttled.
map $request_method $solvun_admin_login_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $solvun_admin_login_key zone=solvun_admin_login:10m rate=30r/m;
limit_req_status 429;

# ------------------------------------------------------- http -> https

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com admin.example.com;

    # certbot --webroot keeps its challenges here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------ storefront

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    root  /var/www/solvun/web;
    index index.html;

    access_log /var/log/nginx/solvun-shop.access.log;
    error_log  /var/log/nginx/solvun-shop.error.log;

    # Server-level headers are inherited by every location that does not call
    # add_header itself. /index.html and /assets/ re-include them explicitly.
    include snippets/security-shop.conf;

    # Admin endpoints are not part of the storefront.
    location /api/admin/ {
        return 404;
    }

    location /api/ {
        include snippets/proxy-api.conf;
        include snippets/security-shop.conf;
        proxy_pass http://solvun_api/;
    }

    # Pages rendered by the Go app. They keep their original paths because the
    # payment redirect and the emails link to them.
    location /order/ {
        include snippets/proxy-api.conf;
        include snippets/security-shop.conf;
        proxy_pass http://solvun_api;
    }

    location /orders/ {
        include snippets/proxy-api.conf;
        include snippets/security-shop.conf;
        proxy_pass http://solvun_api;
    }

    location = /track {
        include snippets/proxy-api.conf;
        include snippets/security-shop.conf;
        proxy_pass http://solvun_api;
    }

    # Vite emits content-hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # The entry document must always be revalidated so a deploy is picked up.
    location = /index.html {
        include snippets/security-shop.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}

# ---------------------------------------------------------------- admin

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    root  /var/www/solvun/admin;
    index index.html;

    access_log /var/log/nginx/solvun-admin.access.log;
    error_log  /var/log/nginx/solvun-admin.error.log;

    include snippets/security-admin.conf;

    # Optional: restrict the dashboard to known networks. Uncomment and list
    # your addresses; everyone else is rejected before the app is reached.
    # allow 203.0.113.10;
    # allow 10.0.0.0/8;
    # deny all;

    # Sign-in is the only endpoint a stranger can reach, so it gets the extra
    # nginx limiter on top of the app's per-client limiter.
    location = /api/admin/session {
        limit_req zone=solvun_admin_login burst=10 nodelay;

        include snippets/proxy-api.conf;
        include snippets/security-admin.conf;
        proxy_pass http://solvun_api/admin/session;
    }

    location /api/ {
        include snippets/proxy-api.conf;
        include snippets/security-admin.conf;
        proxy_pass http://solvun_api/;
    }

    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include snippets/security-admin.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
