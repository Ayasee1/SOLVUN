name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

# Runner image is pinned on purpose: `ubuntu-latest` moved to Ubuntu 26.04 and
# Playwright 1.59.1 refuses to install Chromium there
# ("Playwright does not support chromium on ubuntu26.04-x64"). Bump both the
# image and Playwright together when the pinned version supports it.

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  storefront:
    name: Storefront (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-web-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and build
        run: bun run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: storefront-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-admin-${{ hashFiles('admin/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck and build
        run: bun run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7
          if-no-files-found: error

  admin-tests:
    name: Admin (browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-admin-${{ hashFiles('admin/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run test:browser:install

      - name: Run browser tests
        run: bun run test

  nginx:
    name: Nginx config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs `nginx -t` with dummy certificates, then starts nginx with a mock
      # upstream and asserts the proxy/SPA routing rules.
      - name: Validate config and routing
        run: bash deploy/nginx/test.sh

  ci:
    name: CI
    if: always()
    needs: [backend, storefront, admin, admin-tests, nginx]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        run: |
          echo "backend:      ${{ needs.backend.result }}"
          echo "storefront:   ${{ needs.storefront.result }}"
          echo "admin:        ${{ needs.admin.result }}"
          echo "admin-tests:  ${{ needs.admin-tests.result }}"
          echo "nginx:        ${{ needs.nginx.result }}"

          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
